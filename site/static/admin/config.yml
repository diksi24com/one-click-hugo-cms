backend:
  name: github
  repo: diksi24com/one-click-hugo-cms
  branch: main
  base_url: https://sveltia-cms-auth.diksi-com2026.workers.dev

media_folder: "site/static/img"
public_folder: "img"

collections:
  # ===== BERITA =====
  - name: "post"
    label: "Berita"
    label_singular: "Berita"
    folder: "site/content/post"
    path: "{{slug}}/index"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul", name: "title", widget: "string"}
      - {label: "Tanggal", name: "date", widget: "datetime"}
      - {label: "Ringkasan (Intro Blurb)", name: "description", widget: "text"}
      - {label: "Gambar Utama", name: "image", widget: "image", required: false}
      - {label: "Kategori", name: "categories", widget: "list", required: false, default: ["Berita"]}
      - {label: "Penulis", name: "author", widget: "string", required: false, default: "Redaksi Diksi24"}
      - {label: "Isi Berita", name: "body", widget: "markdown"}

  # ===== HALAMAN STATIS (Bisa buat baru) =====
  - name: "pages"
    label: "Halaman"
    label_singular: "Halaman Baru"
    folder: "site/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Judul Halaman", name: "title", widget: "string"}
      - {label: "Tanggal", name: "date", widget: "datetime"}
      - {label: "Deskripsi Singkat", name: "description", widget: "text", required: false}
      - {label: "Isi Halaman", name: "body", widget: "markdown"}

  # ===== HALAMAN KHUSUS (Home, Kontak) =====
  - name: "special_pages"
    label: "Halaman Khusus"
    files:
      - file: "site/content/contact/_index.md"
        label: "Hubungi Kami"
        name: "contact"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Body, name: body, widget: markdown}

  # ===== PENGATURAN SITUS =====
  - name: "site_settings"
    label: "Pengaturan Situs"
    files:
      - file: "site/hugo.toml"
        label: "Konfigurasi Utama"
        name: "config"
        editor:
          preview: false
        fields:
          - {label: "Judul Situs (Tab Browser)", name: "title", widget: "string"}
